name: Deploy to GitHub Pages

on:
  push:
    branches: [apr-25]   # keep your branch name
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20   # Node 18 is still OK, but 20 is LTS

      - name: Install dependencies
        run: npm ci          # or yarn install / pnpm install

      - name: Build project
        run: npm run build   # runs next build && next export in your package.json

      - name: Package static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out        # folder produced by `next export`

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
