<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} — Essays</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="author" content="Ufuk Çakır">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="../assets/favicon.ico">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Ufuk Çakır — Essays">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  {{OG_IMAGE}}

  <link rel="alternate" type="application/atom+xml" title="Essays — Ufuk Çakır" href="feed.xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">

  <script>
    /* Apply the saved/preferred theme before first paint (no flash). */
    (function () {
      try {
        var t = localStorage.getItem("notes-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <div class="sheet sheet--wide">
    <header class="note-topbar">
      <a class="wordmark-sm" href="index.html">Essays</a>
      <nav aria-label="Essays navigation">
        <a href="../index.html">Ufuk Çakır</a>
        {{PDF_LINK}}
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme" title="Switch to dark theme" aria-pressed="false">
          <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"></path>
          </svg>
          <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path>
          </svg>
        </button>
      </nav>
    </header>

    <main class="essay-main">
      <nav class="essay-toc" id="essay-toc" aria-label="On this page"></nav>

      <article class="essay">
        <header class="essay-head">
          <h1 class="essay-title">{{TITLE}}</h1>
          {{DEK}}
          {{BYLINE}}
        </header>

        <div class="essay-body" id="content">
{{BODY}}
        </div>

        {{BACKLINKS}}

        {{CITE}}

        {{COMMENTS}}

        <footer class="essay-foot">
          {{FOOTER}}
        </footer>
      </article>
    </main>
  </div>

  <script defer src="theme.js"></script>
  <script defer src="notes.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var el = document.getElementById("content");
      if (el && window.renderMathInElement) {
        renderMathInElement(el, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    });
  </script>
</body>
</html>
